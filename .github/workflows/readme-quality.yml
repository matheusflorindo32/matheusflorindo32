name: Validate Professional Profile

"on":
  push:
    branches:
      - main
    paths:
      - README.md
      - assets/**
      - data/**
      - scripts/validate_profile.py
      - .github/workflows/readme-quality.yml
  pull_request:
    paths:
      - README.md
      - assets/**
      - data/**
      - scripts/validate_profile.py
      - .github/workflows/readme-quality.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run profile validator
        run: python scripts/validate_profile.py
