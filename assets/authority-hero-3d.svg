<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Matheus Florindo — Produtos Digitais, Tecnologia e Ciência Aplicada</title>
  <desc id="desc">Cabeçalho tridimensional premium em tons claros, grafite e dourado.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#f5f7fb"/>
      <stop offset="1" stop-color="#e8edf5"/>
    </linearGradient>
    <linearGradient id="graphite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#263348"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9f7115"/>
      <stop offset="0.48" stop-color="#e6c66f"/>
      <stop offset="1" stop-color="#b88829"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="clip"><rect x="1" y="1" width="1198" height="378" rx="30"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect x="1" y="1" width="1198" height="378" rx="30" fill="url(#page)" stroke="#cbd5e1" stroke-width="2"/>
    <ellipse cx="1015" cy="160" rx="265" ry="220" fill="url(#halo)"/>
    <path d="M0 326 C240 270 420 374 660 319 C855 274 1030 300 1200 245 L1200 380 L0 380 Z" fill="#0f172a" opacity="0.025"/>
    <path d="M0 348 C250 310 470 386 725 342 C915 310 1060 318 1200 285" fill="none" stroke="#d4af37" stroke-opacity="0.18" stroke-width="2"/>

    <g transform="translate(62 55)">
      <rect width="9" height="202" rx="4.5" fill="url(#gold)"/>
      <text x="34" y="49" fill="#0f172a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="52" font-weight="850" letter-spacing="1.2">MATHEUS FLORINDO</text>
      <text x="36" y="87" fill="#9a6d16" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="750" letter-spacing="2.2">PRODUTOS DIGITAIS • IA • DADOS • CIÊNCIA APLICADA</text>
      <text x="36" y="130" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="500">Tecnologia construída para resolver problemas reais,</text>
      <text x="36" y="159" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="500">com experiência de campo, método e execução.</text>

      <g transform="translate(36 190)">
        <rect width="290" height="46" rx="23" fill="#ffffff" stroke="#d6b75d" stroke-width="1.5" filter="url(#shadow)"/>
        <circle cx="25" cy="23" r="7" fill="#22c55e">
          <animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <text x="43" y="29" fill="#1e293b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="750" letter-spacing="0.6">PRODUTOS DIGITAIS PUBLICADOS</text>
      </g>
    </g>

    <g transform="translate(770 47)" filter="url(#shadow)">
      <ellipse cx="190" cy="278" rx="190" ry="30" fill="#0f172a" opacity="0.10" filter="url(#soft)"/>

      <g transform="translate(45 30) rotate(-7 150 110)">
        <rect x="0" y="0" width="304" height="205" rx="25" fill="#d4af37" opacity="0.22"/>
        <rect x="12" y="-12" width="304" height="205" rx="25" fill="#e2e8f0" stroke="#cbd5e1"/>
      </g>

      <g transform="translate(25 20) rotate(4 160 110)">
        <rect x="0" y="0" width="326" height="216" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
        <rect x="0" y="0" width="326" height="57" rx="26" fill="url(#graphite)"/>
        <rect x="0" y="34" width="326" height="23" fill="url(#graphite)"/>
        <circle cx="27" cy="28" r="6" fill="#e6c66f"/>
        <circle cx="49" cy="28" r="6" fill="#38bdf8"/>
        <circle cx="71" cy="28" r="6" fill="#22c55e"/>
        <text x="101" y="35" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">DIGITAL COMMAND CENTER</text>

        <rect x="23" y="82" width="126" height="83" rx="15" fill="#f8fafc" stroke="#dbe3ee"/>
        <rect x="166" y="82" width="137" height="83" rx="15" fill="#f8fafc" stroke="#dbe3ee"/>
        <rect x="23" y="180" width="280" height="10" rx="5" fill="#e2e8f0"/>
        <rect x="23" y="180" width="204" height="10" rx="5" fill="url(#blue)">
          <animate attributeName="width" values="120;247;204" dur="4s" repeatCount="indefinite"/>
        </rect>

        <path d="M43 142 L65 121 L85 133 L110 101 L130 113" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="65" cy="121" r="5" fill="#e6c66f"/>
        <circle cx="110" cy="101" r="5" fill="#e6c66f"/>
        <g transform="translate(185 102)">
          <rect width="92" height="13" rx="6.5" fill="#dbeafe"/>
          <rect y="25" width="70" height="13" rx="6.5" fill="#dcfce7"/>
          <rect y="50" width="105" height="13" rx="6.5" fill="#fef3c7"/>
        </g>
      </g>

      <g transform="translate(0 252)">
        <rect x="0" y="0" width="112" height="42" rx="14" fill="#ffffff" stroke="#d7dee9"/>
        <text x="56" y="27" text-anchor="middle" fill="#0f172a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800">REACT</text>
        <rect x="123" y="0" width="135" height="42" rx="14" fill="#ffffff" stroke="#d7dee9"/>
        <text x="190" y="27" text-anchor="middle" fill="#0f172a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800">TYPESCRIPT</text>
        <rect x="269" y="0" width="106" height="42" rx="14" fill="#ffffff" stroke="#d7dee9"/>
        <text x="322" y="27" text-anchor="middle" fill="#0f172a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800">AI</text>
      </g>

      <animateTransform attributeName="transform" type="translate" values="770 47;770 40;770 47" dur="5.5s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>