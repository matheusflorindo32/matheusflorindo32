<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Indicadores de impacto profissional de Matheus Florindo</title>
  <desc id="desc">Cinco produtos digitais, quatro artigos publicados, três livros com ISBN e experiência operacional desde 2010.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.52" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="34" fill="url(#bg)"/>
  <path d="M0 242 C210 180 340 290 548 222 C742 158 920 258 1200 176 V300 H0Z" fill="#ffffff" opacity="0.56"/>
  <circle cx="1080" cy="36" r="54" fill="#fbbf24" opacity="0.12" filter="url(#glow)">
    <animate attributeName="opacity" values="0.08;0.20;0.08" dur="5s" repeatCount="indefinite"/>
  </circle>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#0f172a">
    <text x="56" y="54" font-size="15" font-weight="700" letter-spacing="3">IMPACTO COMPROVÁVEL</text>
    <text x="56" y="88" font-size="27" font-weight="800">Produtos, ciência e experiência de campo</text>
  </g>

  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(56 116)">
      <rect width="252" height="132" rx="24" fill="#ffffff" stroke="#dbeafe"/>
      <rect x="0" y="0" width="9" height="132" rx="5" fill="url(#blue)"/>
      <circle cx="48" cy="44" r="22" fill="#dbeafe"/>
      <path d="M37 45h22M48 34v22" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
      <text x="82" y="54" font-size="40" font-weight="900" fill="#0f172a">5</text>
      <text x="28" y="92" font-size="17" font-weight="800" fill="#1e3a8a">PRODUTOS DIGITAIS</text>
      <text x="28" y="116" font-size="13" fill="#475569">publicados e em operação</text>
    </g>

    <g transform="translate(326 116)">
      <rect width="252" height="132" rx="24" fill="#ffffff" stroke="#d1fae5"/>
      <rect x="0" y="0" width="9" height="132" rx="5" fill="url(#green)"/>
      <circle cx="48" cy="44" r="22" fill="#d1fae5"/>
      <path d="M38 52l7-20 6 12 6-8 5 16" fill="none" stroke="#047857" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="54" font-size="40" font-weight="900" fill="#0f172a">4</text>
      <text x="28" y="92" font-size="17" font-weight="800" fill="#065f46">ARTIGOS CIENTÍFICOS</text>
      <text x="28" y="116" font-size="13" fill="#475569">publicados com DOI</text>
    </g>

    <g transform="translate(596 116)">
      <rect width="252" height="132" rx="24" fill="#ffffff" stroke="#ede9fe"/>
      <rect x="0" y="0" width="9" height="132" rx="5" fill="url(#violet)"/>
      <circle cx="48" cy="44" r="22" fill="#ede9fe"/>
      <path d="M37 34h10c5 0 8 3 8 8v15c-2-3-5-4-9-4h-9zm22 0h-2v23c2-3 5-4 9-4h7V34z" fill="none" stroke="#6d28d9" stroke-width="3" stroke-linejoin="round"/>
      <text x="82" y="54" font-size="40" font-weight="900" fill="#0f172a">3</text>
      <text x="28" y="92" font-size="17" font-weight="800" fill="#5b21b6">LIVROS COM ISBN</text>
      <text x="28" y="116" font-size="13" fill="#475569">produção técnico-científica</text>
    </g>

    <g transform="translate(866 116)">
      <rect width="278" height="132" rx="24" fill="#ffffff" stroke="#fde68a"/>
      <rect x="0" y="0" width="9" height="132" rx="5" fill="url(#gold)"/>
      <circle cx="48" cy="44" r="22" fill="#fef3c7"/>
      <path d="M48 31v26M35 44h26" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
      <text x="82" y="54" font-size="32" font-weight="900" fill="#0f172a">2010+</text>
      <text x="28" y="92" font-size="17" font-weight="800" fill="#92400e">EXPERIÊNCIA OPERACIONAL</text>
      <text x="28" y="116" font-size="13" fill="#475569">Marinha do Brasil e PMES</text>
    </g>
  </g>
</svg>