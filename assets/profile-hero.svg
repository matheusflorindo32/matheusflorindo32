<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Matheus Florindo</title>
  <desc id="desc">Tecnologia aplicada, ciência orientada a evidências e soluções para contextos reais.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#101c2e"/>
      <stop offset="1" stop-color="#1b2433"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a97919"/>
      <stop offset="0.5" stop-color="#e5c56f"/>
      <stop offset="1" stop-color="#b8892d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <circle cx="1085" cy="55" r="145" fill="#d4af37" opacity="0.06"/>
  <circle cx="1130" cy="270" r="210" fill="#d4af37" opacity="0.035"/>
  <path d="M0 262 C250 220 460 315 725 262 C930 220 1065 236 1200 208 L1200 320 L0 320 Z" fill="#ffffff" opacity="0.025"/>

  <rect x="58" y="48" width="8" height="166" rx="4" fill="url(#gold)"/>

  <g filter="url(#shadow)">
    <text x="92" y="105" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="800" letter-spacing="2">MATHEUS FLORINDO</text>
    <text x="95" y="148" fill="#e5c56f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" letter-spacing="0.7">TECNOLOGIA APLICADA • CIÊNCIA ORIENTADA A EVIDÊNCIAS</text>
    <text x="95" y="184" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">Soluções digitais, educacionais e científicas para contextos reais.</text>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">
    <rect x="94" y="228" width="150" height="38" rx="19" fill="#d4af37" opacity="0.15" stroke="#d4af37"/>
    <text x="169" y="253" text-anchor="middle" fill="#f1d98b">SOFTWARE</text>

    <rect x="258" y="228" width="178" height="38" rx="19" fill="#d4af37" opacity="0.12" stroke="#d4af37"/>
    <text x="347" y="253" text-anchor="middle" fill="#f1d98b">IA &amp; AUTOMAÇÃO</text>

    <rect x="450" y="228" width="130" height="38" rx="19" fill="#d4af37" opacity="0.10" stroke="#d4af37"/>
    <text x="515" y="253" text-anchor="middle" fill="#f1d98b">DADOS &amp; BI</text>

    <rect x="594" y="228" width="142" height="38" rx="19" fill="#d4af37" opacity="0.09" stroke="#d4af37"/>
    <text x="665" y="253" text-anchor="middle" fill="#f1d98b">EDUCAÇÃO</text>

    <rect x="750" y="228" width="132" height="38" rx="19" fill="#d4af37" opacity="0.08" stroke="#d4af37"/>
    <text x="816" y="253" text-anchor="middle" fill="#f1d98b">PESQUISA</text>

    <rect x="896" y="228" width="224" height="38" rx="19" fill="#d4af37" opacity="0.07" stroke="#d4af37"/>
    <text x="1008" y="253" text-anchor="middle" fill="#f1d98b">SEGURANÇA PÚBLICA</text>
  </g>

  <text x="1140" y="296" text-anchor="end" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Ecossistema profissional multidisciplinar</text>
</svg>