<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Matheus Florindo de Deus</title>
  <desc id="desc">Perfil profissional multidisciplinar em tecnologia, ciência, dados, educação e segurança pública.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050A12"/>
      <stop offset="0.52" stop-color="#0D1726"/>
      <stop offset="1" stop-color="#172238"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF1A8"/>
      <stop offset="0.28" stop-color="#E8C65C"/>
      <stop offset="0.63" stop-color="#B98019"/>
      <stop offset="1" stop-color="#6E4306"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.025"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E8C65C" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#E8C65C" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.52"/>
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity="0.48"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="30" fill="url(#background)"/>
  <rect width="1200" height="360" rx="30" fill="url(#grid)"/>
  <ellipse cx="1010" cy="160" rx="320" ry="260" fill="url(#glow)"/>

  <g filter="url(#softShadow)">
    <path d="M932 47 L1082 87 L1082 235 L932 276 L782 235 L782 87 Z" fill="#07101D" stroke="#E8C65C" stroke-opacity="0.32" stroke-width="2"/>
    <path d="M932 64 L1065 99 L1065 223 L932 259 L799 223 L799 99 Z" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <path d="M932 86 L1038 114 L1038 208 L932 237 L826 208 L826 114 Z" fill="#0C1828" stroke="#E8C65C" stroke-opacity="0.35"/>
    <path d="M932 105 L1014 127 L1014 195 L932 218 L850 195 L850 127 Z" fill="url(#gold)" opacity="0.96"/>
    <path d="M932 120 L994 137 L994 185 L932 202 L870 185 L870 137 Z" fill="#07101D" opacity="0.96"/>
    <text x="932" y="174" text-anchor="middle" fill="#F8E8A4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="900" letter-spacing="3">MF</text>
    <path d="M932 47 L1082 87 L1065 99 L932 64 L799 99 L782 87 Z" fill="#FFFFFF" opacity="0.07"/>
  </g>

  <g filter="url(#textShadow)">
    <text x="76" y="92" fill="#D8B74F" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800" letter-spacing="4">PORTFÓLIO PROFISSIONAL</text>
    <text x="72" y="150" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="55" font-weight="900" letter-spacing="1.4">MATHEUS FLORINDO</text>
    <text x="75" y="192" fill="#E8C65C" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="0.8">TECNOLOGIA • CIÊNCIA • DADOS • EDUCAÇÃO</text>
    <text x="75" y="228" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500">Soluções digitais e científicas para problemas reais,</text>
    <text x="75" y="255" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="500">com aplicação em educação, desempenho e segurança pública.</text>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="0.7">
    <rect x="74" y="292" width="128" height="34" rx="17" fill="url(#glass)" stroke="#E8C65C" stroke-opacity="0.38"/>
    <text x="138" y="314" text-anchor="middle" fill="#F6DEA0">SOFTWARE</text>
    <rect x="214" y="292" width="156" height="34" rx="17" fill="url(#glass)" stroke="#E8C65C" stroke-opacity="0.30"/>
    <text x="292" y="314" text-anchor="middle" fill="#F6DEA0">IA &amp; AUTOMAÇÃO</text>
    <rect x="382" y="292" width="114" height="34" rx="17" fill="url(#glass)" stroke="#E8C65C" stroke-opacity="0.27"/>
    <text x="439" y="314" text-anchor="middle" fill="#F6DEA0">DADOS &amp; BI</text>
    <rect x="508" y="292" width="126" height="34" rx="17" fill="url(#glass)" stroke="#E8C65C" stroke-opacity="0.24"/>
    <text x="571" y="314" text-anchor="middle" fill="#F6DEA0">PESQUISA</text>
    <rect x="646" y="292" width="174" height="34" rx="17" fill="url(#glass)" stroke="#E8C65C" stroke-opacity="0.22"/>
    <text x="733" y="314" text-anchor="middle" fill="#F6DEA0">SEGURANÇA PÚBLICA</text>
  </g>

  <text x="1115" y="324" text-anchor="middle" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">ECOSSISTEMA MULTIDISCIPLINAR</text>
</svg>