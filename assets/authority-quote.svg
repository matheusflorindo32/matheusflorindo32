<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc">
  <title id="title">Não negocie com sua mente</title>
  <desc id="desc">Rodapé premium claro com frase de autoridade e animação discreta.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf1f7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f6310"/>
      <stop offset="0.5" stop-color="#e3c267"/>
      <stop offset="1" stop-color="#9f7115"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.14"/></filter>
  </defs>
  <rect x="1" y="1" width="1198" height="208" rx="28" fill="url(#bg)" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M0 168 C230 117 421 218 660 159 C860 110 1010 147 1200 92 L1200 210 L0 210 Z" fill="#0f172a" opacity="0.03"/>
  <circle cx="106" cy="104" r="58" fill="#d4af37" opacity="0.08"/>
  <circle cx="1094" cy="104" r="58" fill="#2563eb" opacity="0.06"/>
  <g filter="url(#shadow)">
    <text x="600" y="86" text-anchor="middle" fill="#0f172a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="850" letter-spacing="1.2">“NÃO NEGOCIE COM SUA MENTE.”</text>
    <text x="600" y="126" text-anchor="middle" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600">Disciplina para executar. Ciência para decidir. Tecnologia para transformar.</text>
  </g>
  <rect x="389" y="151" width="422" height="5" rx="2.5" fill="#dbe2ec"/>
  <rect x="389" y="151" width="145" height="5" rx="2.5" fill="url(#gold)">
    <animate attributeName="x" values="389;666;389" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="width" values="145;92;145" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text x="600" y="185" text-anchor="middle" fill="#8a6a24" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="2">MATHEUS FLORINDO • BRASIL</text>
</svg>