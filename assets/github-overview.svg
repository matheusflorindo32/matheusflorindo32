<svg xmlns="http://www.w3.org/2000/svg" width="580" height="230" viewBox="0 0 580 230" role="img" aria-labelledby="title desc">
  <title id="title">Visão geral do portfólio GitHub</title>
  <desc id="desc">Resumo visual dos repositórios públicos, projetos selecionados e áreas de atuação.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1525"/>
      <stop offset="1" stop-color="#172235"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="578" height="228" rx="20" fill="url(#bg)" stroke="#334155"/>
  <rect x="24" y="24" width="5" height="34" rx="2.5" fill="#d4af37"/>
  <text x="42" y="48" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Portfólio público no GitHub</text>
  <text x="42" y="70" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Indicadores hospedados no próprio repositório</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="24" y="94" width="160" height="92" rx="14" fill="#ffffff" opacity="0.035" stroke="#334155"/>
    <text x="104" y="137" text-anchor="middle" fill="#e5c56f" font-size="34" font-weight="800">27</text>
    <text x="104" y="163" text-anchor="middle" fill="#cbd5e1" font-size="13">repositórios públicos</text>

    <rect x="210" y="94" width="160" height="92" rx="14" fill="#ffffff" opacity="0.035" stroke="#334155"/>
    <text x="290" y="137" text-anchor="middle" fill="#e5c56f" font-size="34" font-weight="800">6</text>
    <text x="290" y="163" text-anchor="middle" fill="#cbd5e1" font-size="13">projetos selecionados</text>

    <rect x="396" y="94" width="160" height="92" rx="14" fill="#ffffff" opacity="0.035" stroke="#334155"/>
    <text x="476" y="137" text-anchor="middle" fill="#e5c56f" font-size="34" font-weight="800">6</text>
    <text x="476" y="163" text-anchor="middle" fill="#cbd5e1" font-size="13">frentes integradas</text>
  </g>

  <circle cx="28" cy="207" r="4" fill="#22c55e"/>
  <text x="40" y="212" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Atualização automática configurada via GitHub Actions</text>
</svg>