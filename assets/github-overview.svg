<svg xmlns="http://www.w3.org/2000/svg" width="580" height="230" viewBox="0 0 580 230" role="img" aria-labelledby="title desc">
  <title id="title">GitHub em dados</title>
  <desc id="desc">Indicadores públicos calculados pela API oficial do GitHub.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf1f7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#956914"/>
      <stop offset="0.52" stop-color="#e5c56f"/>
      <stop offset="1" stop-color="#a97919"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="190%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="578" height="228" rx="21" fill="url(#bg)" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="520" cy="35" r="76" fill="#d4af37" opacity="0.07"/>
  <rect x="24" y="24" width="6" height="39" rx="3" fill="url(#gold)"/>
  <text x="43" y="46" fill="#0f172a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="850">GITHUB EM DADOS</text>
  <text x="43" y="69" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5">Indicadores públicos • API oficial • ativo próprio</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif"><g filter="url(#shadow)">
      <rect x="30" y="103" width="119" height="84" rx="15" fill="#94a3b8" opacity="0.16"/>
      <rect x="25" y="96" width="119" height="84" rx="15" fill="#ffffff" stroke="#d7dee9"/>
      <text x="84.5" y="135" text-anchor="middle" fill="#0f172a" font-size="29" font-weight="850">27</text>
      <text x="84.5" y="160" text-anchor="middle" fill="#64748b" font-size="9.8" font-weight="800" letter-spacing="0.55">REPOSITÓRIOS</text>
    </g><g filter="url(#shadow)">
      <rect x="164" y="103" width="119" height="84" rx="15" fill="#94a3b8" opacity="0.16"/>
      <rect x="159" y="96" width="119" height="84" rx="15" fill="#ffffff" stroke="#d7dee9"/>
      <text x="218.5" y="135" text-anchor="middle" fill="#0f172a" font-size="29" font-weight="850">24</text>
      <text x="218.5" y="160" text-anchor="middle" fill="#64748b" font-size="9.8" font-weight="800" letter-spacing="0.55">PROJETOS ORIGINAIS</text>
    </g><g filter="url(#shadow)">
      <rect x="298" y="103" width="119" height="84" rx="15" fill="#94a3b8" opacity="0.16"/>
      <rect x="293" y="96" width="119" height="84" rx="15" fill="#ffffff" stroke="#d7dee9"/>
      <text x="352.5" y="135" text-anchor="middle" fill="#0f172a" font-size="29" font-weight="850">0</text>
      <text x="352.5" y="160" text-anchor="middle" fill="#64748b" font-size="9.8" font-weight="800" letter-spacing="0.55">STARS</text>
    </g><g filter="url(#shadow)">
      <rect x="432" y="103" width="119" height="84" rx="15" fill="#94a3b8" opacity="0.16"/>
      <rect x="427" y="96" width="119" height="84" rx="15" fill="#ffffff" stroke="#d7dee9"/>
      <text x="486.5" y="135" text-anchor="middle" fill="#0f172a" font-size="29" font-weight="850">1</text>
      <text x="486.5" y="160" text-anchor="middle" fill="#64748b" font-size="9.8" font-weight="800" letter-spacing="0.55">SEGUIDORES</text>
    </g></g>
  <circle cx="29" cy="207" r="4.5" fill="#22c55e">
    <animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="42" y="212" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">24 projetos ativos • atualizado em 19/07/2026</text>
</svg>